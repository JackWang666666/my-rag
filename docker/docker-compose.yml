# Infrastructure plus, behind the `apps` profile, the three application services.
#
#   docker compose up -d                      # Milvus + Neo4j + Attu only
#   docker compose --profile apps up -d       # ... and the two backends and the UI
#
# The default is infra-only because the usual loop is to run the backends from an
# IDE against containerised Milvus and Neo4j.
#
# `version:` is deliberately absent — Compose v2 ignores it and warns that it is
# obsolete.
#
# Configuration comes from `docker/.env` (copy `.env.example`). Compose loads that
# file automatically and every ${...} below reads from it. Note that Compose
# interpolates the whole file *before* filtering by profile, so nothing here may
# use the `${VAR:?error}` required form — it would break plain `up -d` too.

# Settings both backends must agree on. They share one SQLite metadata database
# and one uploads directory, so a disagreement here means the UI sees different
# data depending on which backend it is pointed at.
x-backend-env: &backend-env
  # Service names, not localhost: inside the network each container is its own
  # localhost.
  MILVUS_HOST: milvus
  MILVUS_PORT: "19530"
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j123456}

  # Same path in both containers, backed by the same volume.
  DB_PATH: /app/data/rag.db
  UPLOAD_DIR: /app/uploads

  # SET THIS in docker/.env. Left empty, each backend generates its own random
  # secret at startup (and says so in its log), which means a token minted by one
  # is rejected by the other and switching backends in the UI forces a re-login.
  JWT_SECRET: ${JWT_SECRET:-}
  ACCESS_TOKEN_EXPIRE_HOURS: ${ACCESS_TOKEN_EXPIRE_HOURS:-72}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  # Empty means a random password, printed once in the startup log.
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  # The browser origin, i.e. where the frontend is served from — not a backend URL.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
  OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  # host.docker.internal reaches an Ollama running on the host; a bare localhost
  # would point at the backend container itself.
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2:7b}

  CHUNK_SIZE: ${CHUNK_SIZE:-1000}
  CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
  RERANKER_PROVIDER: ${RERANKER_PROVIDER:-llm}
  RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
  RERANK_TOP_K: ${RERANK_TOP_K:-5}
  RERANK_THRESHOLD: ${RERANK_THRESHOLD:-3.0}
  GRAPH_MAX_CHUNKS: ${GRAPH_MAX_CHUNKS:-40}

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: rag-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 10s
      retries: 6
    networks:
      - rag-network

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: rag-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 6
    networks:
      - rag-network

  milvus:
    image: milvusdb/milvus:v2.4.1
    container_name: rag-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      start_period: 90s
      timeout: 10s
      retries: 12
    ports:
      - "19530:19530"
      - "9091:9091"
    # Milvus exits if etcd or MinIO are merely *started* but not yet accepting
    # connections, which is what the previous list-form depends_on allowed. The
    # condition makes Compose wait for the health checks above.
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - rag-network

  neo4j:
    image: neo4j:5.18-community
    container_name: rag-neo4j
    environment:
      # Only applied when the neo4j_data volume is created. Changing the password
      # later needs `docker compose down -v neo4j` or a cypher ALTER USER.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j123456}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      start_period: 30s
      timeout: 10s
      retries: 10
    networks:
      - rag-network

  attu:
    image: zilliz/attu:v2.3.10
    container_name: rag-attu
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3300:3000"
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - rag-network

  # --- Applications (profile: apps) ---------------------------------------
  #
  # Both backends write the same SQLite metadata database and read the same
  # uploads directory, so `rag_data` and `rag_uploads` are mounted into both.
  # That is the whole point of the shared-store design: whichever backend the UI
  # is pointed at, it sees the same knowledge bases, documents and sessions.

  langchain-rag:
    build:
      context: ../langchain-rag
    image: rag/langchain-rag:latest
    container_name: rag-langchain
    profiles: ["apps"]
    environment:
      <<: *backend-env
      # Python-only providers.
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-m3}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY:-}
      VOLCENGINE_API_BASE: ${VOLCENGINE_API_BASE:-https://ark.cn-beijing.volces.com/api/v3}
      VOLCENGINE_MODEL: ${VOLCENGINE_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      - rag_data:/app/data
      - rag_uploads:/app/uploads
    depends_on:
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - rag-network

  spring-ai-rag:
    build:
      context: ../spring-ai-rag
    image: rag/spring-ai-rag:latest
    container_name: rag-spring
    profiles: ["apps"]
    environment:
      <<: *backend-env
      # Spring AI appends /v1 itself, so the suffix-free form is what it wants.
      # SPRING_OPENAI_API_BASE stays available for the case where the two backends
      # genuinely need different endpoints; otherwise OPENAI_API_BASE is enough,
      # because the Java side strips a trailing /v1 before use.
      OPENAI_API_BASE: ${SPRING_OPENAI_API_BASE:-${OPENAI_API_BASE:-https://api.openai.com}}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_DATABASE: ${MILVUS_DATABASE:-default}
    ports:
      - "8080:8080"
    volumes:
      - rag_data:/app/data
      - rag_uploads:/app/uploads
    depends_on:
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - rag-network

  frontend:
    build:
      context: ../frontend
      # NEXT_PUBLIC_* is baked into the JavaScript bundle at build time, so these
      # are build args rather than environment variables. They are the URLs the
      # browser calls, which is why they are host addresses and not service
      # names: "http://spring-ai-rag:8080" only resolves between containers.
      args:
        NEXT_PUBLIC_SPRING_API_URL: ${NEXT_PUBLIC_SPRING_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_LANGCHAIN_API_URL: ${NEXT_PUBLIC_LANGCHAIN_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_DEFAULT_BACKEND: ${NEXT_PUBLIC_DEFAULT_BACKEND:-spring}
    image: rag/frontend:latest
    container_name: rag-frontend
    profiles: ["apps"]
    ports:
      - "3000:3000"
    # Only `depends_on` for ordering: the UI is a static bundle plus a Node
    # server, and the browser — not this container — talks to the backends.
    depends_on:
      - langchain-rag
      - spring-ai-rag
    networks:
      - rag-network

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
  neo4j_logs:
  # Shared between the two backends. Deleting this volume deletes every account,
  # knowledge base and chat session.
  rag_data:
  rag_uploads:

networks:
  rag-network:
    driver: bridge
